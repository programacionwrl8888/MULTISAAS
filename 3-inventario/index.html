<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiSAAS - Inventario por Placa</title>
   <link rel="manifest" href="manifest.json">
  <!-- CDN Oficial y Correcto de Tailwind CSS -->
  <script src="https://tailwindcss.com"></script>
  <!-- SDK de Supabase -->
  <script src="https://jsdelivr.net"></script>

</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4">

  <main class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6 border border-slate-100 space-y-6">
    
    <header class="flex items-center gap-3 border-b pb-4">
      <div class="bg-amber-100 p-2.5 rounded-xl text-amber-600 font-bold text-2xl">📦</div>
      <div>
        <h1 class="text-lg font-bold tracking-tight">Inventario de Activos</h1>
        <p class="text-xs text-slate-500">Control de placas y custodia segura</p>
      </div>
    </header>

    <!-- BÚSQUEDA GLOBAL -->
    <section class="space-y-2">
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Buscar Elemento</label>
      <div class="flex gap-2">
        <input type="text" id="txt-busqueda" placeholder="Buscar por Placa, Nombre o ID..." class="flex-grow p-2.5 text-xs bg-slate-50 rounded-xl border border-slate-300 focus:outline-amber-500">
        <button onclick="buscarActivo()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 rounded-xl text-xs transition shadow-sm">Buscar</button>
      </div>
    </section>

    <!-- RESULTADO DE BÚSQUEDA -->
    <section id="card-activo" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3 relative">
      <div class="flex justify-between items-start">
        <div>
          <span id="badge-estado" class="text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">En Sitio</span>
          <h2 id="act-nombre" class="font-bold text-sm text-slate-900 mt-1">Nombre del Activo</h2>
          <p class="text-xs text-slate-500">Placa: <span id="act-placa" class="font-mono font-bold text-slate-700">---</span></p>
        </div>
        <div class="text-right">
          <p class="text-[10px] text-slate-400">Custodio Actual:</p>
          <p id="act-custodio" class="text-xs font-semibold text-slate-700">---</p>
        </div>
      </div>

      <div id="alerta-activo" class="hidden bg-rose-50 border border-rose-200 text-rose-800 p-2.5 rounded-lg text-xs font-medium">
        ⚠️ <strong>Nota importante:</strong> Elemento fuera de sede.
      </div>

      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200">
        <button onclick="abrirModalTraslado()" class="bg-slate-800 text-white text-[11px] p-2 rounded-lg font-medium hover:bg-slate-900 transition text-center">Transferir Custodia</button>
        <button onclick="marcarNovedadSede()" class="bg-slate-200 text-slate-700 text-[11px] p-2 rounded-lg font-medium hover:bg-slate-300 transition text-center">Marcar Salida / Baja</button>
      </div>
    </section>

    <!-- FORMULARIO CON FIRMA NATIVA -->
    <section id="panel-traslado" class="hidden bg-amber-50/50 border border-amber-200 rounded-2xl p-4 space-y-4">
      <h3 class="font-bold text-slate-800 text-xs uppercase flex items-center gap-1">✍️ Formalizar Traslado de Activo</h3>
      <div class="space-y-2 text-xs">
        <div>
          <label class="block text-slate-500 mb-1">Cédula o ID de quien Recibe:</label>
          <input type="text" id="traslado-receptor" placeholder="Ej: 10234455" class="w-full p-2 bg-white rounded-lg border border-slate-300">
        </div>
        <div>
          <label class="block text-slate-500 mb-1">Nueva Ubicación / Oficina:</label>
          <input type="text" id="traslado-ubicacion" placeholder="Ej: Oficina 302 Sede Norte" class="w-full p-2 bg-white rounded-lg border border-slate-300">
        </div>
        <div>
          <label class="block text-slate-500 mb-1">Firma de Conformidad (Dibujar aquí):</label>
          <div class="border border-slate-300 bg-white rounded-lg overflow-hidden shadow-inner">
            <canvas id="canvas-firma" width="300" height="120" class="w-full block bg-white cursor-crosshair"></canvas>
          </div>
          <button onclick="limpiarFirma()" class="text-[10px] text-rose-600 underline font-semibold mt-1 block text-right">Borrar trazo</button>
        </div>
      </div>
      <button onclick="guardarTrasladoProceso()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold p-2.5 rounded-xl text-xs transition shadow-sm">
        Registrar Traslado con Visto Bueno del Jefe
      </button>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>

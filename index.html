<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiSAAS PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <!-- Carga de Tailwind CSS desde CDN para trabajar en la web -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Encabezado / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">MultiSAAS</h1>
            <span class="bg-indigo-500 text-xs px-2 py-1 rounded-full border border-indigo-400">PWA Activa</span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-md mx-auto w-full p-6 flex flex-col justify-center items-center text-center space-y-6">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 w-full space-y-4">
            <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto text-indigo-600 text-3xl">
                🚀
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">¡Bienvenido a MultiSAAS!</h2>
            <p class="text-slate-500 text-sm leading-relaxed">
                Tu plataforma todo en uno lista para funcionar en cualquier parte. Esta aplicación se ejecuta de forma nativa e independiente.
            </p>
            <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-sm shadow-indigo-200">
                Comenzar ahora
            </button>
        </div>

        <!-- Estado de Conexión -->
        <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-3 w-full flex items-center justify-center space-x-2 text-emerald-800 text-xs font-medium">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
            <span>Disponible sin conexión a internet</span>
        </div>
    </main>

    <!-- Pie de página / Navegación inferior tipo App -->
    <footer class="bg-white border-t border-slate-200 p-4 text-center text-xs text-slate-400">
        <p>&copy; 2026 MultiSAAS. Todos los derechos reservados.</p>
    </footer>

    <!-- Registro del Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado', reg))
                    .catch(err => console.error('Error al registrar', err));
            });
        }
    </script>
</body>
</html>
